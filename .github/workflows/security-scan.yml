name: Security Scan

on:
  pull_request:
    branches: [master]
    paths:
      - '**/SKILL.md'
      - '**/scripts/**'
  push:
    branches: [master]
    paths:
      - '**/SKILL.md'
      - '**/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  detect-changes:
    name: Detect Changed Skills
    runs-on: ubuntu-latest
    outputs:
      changed_dirs: ${{ steps.changed.outputs.dirs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find changed skill directories
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # Manual run or first push -- scan all skill directories
            DIRS=$(find . -maxdepth 2 -name 'SKILL.md' -not -path './.github/*' | sed 's|/SKILL.md||;s|^\./||' | sort | tr '\n' ' ')
            echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
            echo "Scanning all: $DIRS"
            exit 0
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          DIRS=$(git diff --name-only "$BASE" "${{ github.sha }}" -- '*/SKILL.md' '*/scripts/*' | \
            sed 's|/.*||' | sort -u | tr '\n' ' ')

          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "Changed skill directories: $DIRS"

  mcp-scan:
    name: Snyk Agent Scan
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_dirs != ''
    runs-on: ubuntu-latest
    # Advisory: Snyk's public tier has a daily usage limit, so it must never block a push.
    # The job still goes red on a blocking risk or when a skill could not be scanned.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Snyk Agent Scan
        run: pip install 'snyk-agent-scan==0.6.3'
      - name: Scan changed skills
        run: |
          # .github/scripts/snyk-gate.py exits 0 clean, 1 blocking risk, 2 not scanned.
          # "Not scanned" (quota, auth, parse error) is never reported as a pass.
          status=0
          for dir in ${{ needs.detect-changes.outputs.changed_dirs }}; do
            f="$dir/SKILL.md"
            [ -f "$f" ] || continue
            echo "::group::Scanning $f"
            snyk-agent-scan --skills "$f" --json --dangerously-run-mcp-servers > snyk.json 2> snyk.err || true
            tail -n 20 snyk.err
            set +e
            python3 .github/scripts/snyk-gate.py "$f" snyk.json
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" -eq 1 ]; then status=1; fi
            if [ "$rc" -eq 2 ] && [ "$status" -eq 0 ]; then status=2; fi
          done
          exit $status
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Post scan results
        if: always() && github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## Security Scan Complete

          Snyk Agent Scan has finished scanning changed skills. Check workflow logs for details."
        env:
          GH_TOKEN: ${{ github.token }}

  cisco-scan:
    name: Cisco Skill Scanner
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_dirs != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Cisco Skill Scanner
        run: pip install 'cisco-ai-skill-scanner==2.1.0'
      - name: Scan changed skills
        run: |
          # scan-all expects a parent directory containing skill subdirectories,
          # so symlink only changed skills into a temp dir.
          # The policy downgrades guardrail phrasing ("do not tell the user X") to MEDIUM; see the file.
          mkdir -p .scan-target
          for dir in ${{ needs.detect-changes.outputs.changed_dirs }}; do
            ln -s "$PWD/$dir" ".scan-target/$dir"
          done
          echo "Scanning: $(ls .scan-target)"
          skill-scanner scan-all .scan-target --policy .github/skill-scanner-policy.yaml --fail-on-severity high --format sarif --output results.sarif
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: cisco-skill-scanner
        continue-on-error: true
