skill: etf-analyzer
version: 1.0.0
# Trigger evals (bilingual EN+HE): should_trigger true/false + quality assertions
triggers:
  - prompt: "what does QQQ hold and what is its expense ratio"
    should_trigger: true
  - prompt: "compare SPY and VOO"
    should_trigger: true
  - prompt: "how much do VTI and VOO overlap"
    should_trigger: true
  - prompt: "analyze Apple stock fundamentals"
    should_trigger: false   # -> global-stock-analysis
  - prompt: "analyze an Israeli mutual fund"
    should_trigger: false   # out of scope
  # Hebrew triggers — the catalog is Hebrew-first; users ask in Hebrew against the EN description
  - prompt: "אני מחזיק גם VTI וגם VOO — כמה הן חופפות?"
    should_trigger: true    # HE: overlap check
  - prompt: "מה יש בפנים ב-QQQ וכמה דמי ניהול היא גובה?"
    should_trigger: true    # HE: holdings + expense ratio
  - prompt: "תשווה לי בין SPY ל-VOO"
    should_trigger: true    # HE: compare two ETFs
  - prompt: "תנתח לי קרן נאמנות ישראלית"
    should_trigger: false   # HE: Israeli mutual funds out of scope
  - prompt: "מה מצב מניית אפל?"
    should_trigger: false   # HE -> global-stock-analysis (cross-skill)
quality:
  - prompt: "overlap between VTI and VOO"
    assert: "Reports an overlap percentage and the expense-ratio delta with an as-of date."
  - prompt: "כמה VTI ו-VOO חופפות?"
    assert: "Answers in Hebrew with a real overlap percentage, shared top holdings, and both expense ratios."
