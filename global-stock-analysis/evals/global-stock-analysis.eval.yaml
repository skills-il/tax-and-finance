skill: global-stock-analysis
version: 1.0.0
# Trigger evals (bilingual EN+HE): should_trigger true/false + quality assertions
triggers:
  - prompt: "analyze NVDA and tell me if it is overbought"
    should_trigger: true
  - prompt: "what is the RSI and MACD on Microsoft right now"
    should_trigger: true
  - prompt: "give me a technical read on TSLA in the S&P 500"
    should_trigger: true
  - prompt: "analyze Teva shares on the Tel Aviv exchange"
    should_trigger: false   # -> tase-stock-analysis
  - prompt: "should I buy bitcoin today"
    should_trigger: false   # crypto out of scope
  - prompt: "screen the S&P 500 for oversold names"
    should_trigger: false   # -> sp500-nasdaq-screener (cross-skill)
  # Hebrew triggers — the catalog is Hebrew-first; users ask in Hebrew against the EN description
  - prompt: "מה מצב אנבידיה? שווה להיכנס עכשיו?"
    should_trigger: true    # HE: NVDA momentum read
  - prompt: "תעשה לי ניתוח טכני על מניית אפל"
    should_trigger: true    # HE: technical analysis of AAPL
  - prompt: "מה ה-RSI של טסלה כרגע?"
    should_trigger: true    # HE: RSI on TSLA
  - prompt: "תנתח לי את מניית בנק הפועלים בבורסה בתל אביב"
    should_trigger: false   # HE -> tase-stock-analysis
  - prompt: "כדאי לקנות ביטקוין היום?"
    should_trigger: false   # HE: crypto out of scope
quality:
  - prompt: "is NVDA overbought right now"
    assert: "Computes RSI(14) and gives an overbought or oversold read with a level to watch."
  - prompt: "מה מצב אנבידיה, קניית יתר?"
    assert: "Answers in Hebrew with a real RSI(14) value and an overbought/oversold read, citing data freshness."
